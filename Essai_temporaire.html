<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation de Pendule Élastique - Perpétuel</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a252f; /* Un peu plus sombre pour faire ressortir le tracé */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #container {
            position: relative;
        }

        canvas {
            background-color: #ecf0f1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 10px;
            cursor: grab;
            display: block;
        }

        canvas:active {
            cursor: grabbing;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            pointer-events: auto; /* Active les interactions pour le bouton */
            z-index: 10;
        }

        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #2c3e50; }
        p { margin: 0 0 10px 0; font-size: 0.9rem; color: #7f8c8d; }
        
        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="ui">
            <h1>Pendule Perpétuel</h1>
            <p>🔴 Tirer la boule pour lancer.</p>
            <p>✨ Frottements désactivés (oscillation infinie).</p>
            <p>🧵 Tracé mémorisé sur 10,000 points.</p>
            <button id="clearBtn">Effacer la Trajectoire</button>
        </div>

        <canvas id="simulationCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');

        // Taille du canvas
        canvas.width = 800;
        canvas.height = 700; // Un peu plus haut pour plus d'espace d'oscillation

        // --- PARAMÈTRES PHYSIQUES ---
        const origin = { x: canvas.width / 2, y: 70 }; // Point d'attache
        const restLength = 180;  // Longueur de repos légèrement plus courte
        const k = 0.5;           // Constante de raideur
        const mass = 20;         // Masse
        const gravity = 0.8;     // Force de gravité
        
        // --- MODIFICATION ICI ---
        const damping = 1.0;     // Amortissement supprimé (pas de perte d'énergie)

        // --- ÉTAT DU PENDULE ---
        let bob = {
            x: canvas.width / 2 + 180, 
            y: 350,                    
            vx: 0,                     
            vy: 0,                     
            radius: 18                 
        };

        // --- TRAJECTOIRE ---
        let path = [];
        
        // --- MODIFICATION ICI ---
        const maxPathLength = 10000; // Le fil restera très longtemps

        // --- INTERACTION SOURIS ---
        let isDragging = false;

        // --- GESTION DU BOUTON EFFACER ---
        clearBtn.addEventListener('click', () => {
            path = []; // Efface simplement le tableau
        });

        // Interactions Canvas
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const dist = Math.hypot(bob.x - mouseX, bob.y - mouseY);
            if (dist < bob.radius + 15) {
                isDragging = true;
                bob.vx = 0; 
                bob.vy = 0;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const rect = canvas.getBoundingClientRect();
                bob.x = e.clientX - rect.left;
                bob.y = e.clientY - rect.top;
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });


        // --- BOUCLE D'ANIMATION ---
        function animate() {
            // Fond semi-opaque pour créer un léger effet de traînée en plus du fil dessiné
            ctx.fillStyle = 'rgba(236, 240, 241, 0.9)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Moteur Physique
            if (!isDragging) {
                const dx = bob.x - origin.x;
                const dy = bob.y - origin.y;
                const distance = Math.hypot(dx, dy) || 1; 

                // Force de l'élastique
                const springForce = -k * (distance - restLength);

                // Forces totales (Élastique + Gravité)
                const fx = springForce * (dx / distance);
                const fy = springForce * (dy / distance) + (mass * gravity); 

                // Accélération (a = F / m)
                const ax = fx / mass;
                const ay = fy / mass;

                // Mise à jour de la vitesse (avec damping = 1.0)
                bob.vx = (bob.vx + ax) * damping;
                bob.vy = (bob.vy + ay) * damping;

                // Mise à jour de la position
                bob.x += bob.vx;
                bob.y += bob.vy;

                // Enregistrement de la trajectoire
                path.push({ x: bob.x, y: bob.y });
                if (path.length > maxPathLength) {
                    path.shift(); 
                }
            }

            // 1. Dessiner la trajectoire (fil très long)
            if (path.length > 1) {
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(path[i].x, path[i].y);
                }
                // Un bleu un peu plus vif sur le fond plus sombre
                ctx.strokeStyle = 'rgba(41, 128, 185, 0.6)'; 
                ctx.lineWidth = 1.5; // Un peu plus fin pour éviter que ça devienne un gros gribouillage
                ctx.stroke();
            }

            // 2. Dessiner l'élastique
            ctx.beginPath();
            ctx.moveTo(origin.x, origin.y);
            ctx.lineTo(bob.x, bob.y);
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 3. Dessiner le point d'attache
            ctx.beginPath();
            ctx.arc(origin.x, origin.y, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#34495e';
            ctx.fill();

            // 4. Dessiner la masse
            ctx.beginPath();
            ctx.arc(bob.x, bob.y, bob.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#e74c3c'; 
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#c0392b'; 
            ctx.stroke();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
